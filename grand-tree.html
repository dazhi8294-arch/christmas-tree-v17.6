let videoEl = null, handLandmarker = null, camStream = null, camRunning = false, lastVideoTime = -1, lastModeAt = 0, lastGrabAt = 0, gLastLabel = '', gHold = 0;

function setGestureHint(t){ const h = document.getElementById('gesture-hint'); if(h) h.innerText = t; }
function setCamDot(on){ const d = document.getElementById('cam-status'); if(d) d.classList.toggle('active', !!on); }

async function startGesture(){
  const btn = document.getElementById('cam-enable');
  if(camRunning){ if(btn) btn.style.display = 'none'; return; }
  try{
    if(btn){ btn.disabled = true; btn.textContent = '授权中…'; }
    setGestureHint('等待摄像头授权…');
    camStream = await Promise.race([
      navigator.mediaDevices.getUserMedia({ video:{ width:{ideal:640}, height:{ideal:480}, facingMode:'user' }, audio:false }),
      new Promise((_, rej) => setTimeout(() => { const e = new Error('timeout'); e.name = 'TimeoutError'; rej(e); }, 15000))
    ]);
    videoEl = document.getElementById('webcam-video');
    videoEl.srcObject = camStream;
    try{ await videoEl.play(); }catch(e){}
    renderWebcamPreview();
    setGestureHint('加载手势模型…');
    const vision = await import('https://cdn.jsdelivr.net/npm/@mediapipe/tasks-vision@0.10.3/+esm');
    const fileset = await vision.FilesetResolver.forVisionTasks('https://cdn.jsdelivr.net/npm/@mediapipe/tasks-vision@0.10.3/wasm');
    handLandmarker = await vision.HandLandmarker.createFromOptions(fileset, {
      baseOptions:{ modelAssetPath:'https://storage.googleapis.com/mediapipe-models/hand_landmarker/hand_landmarker/float16/1/hand_landmarker.task', delegate:'GPU' },
      runningMode:'VIDEO', numHands:1
    });
    camRunning = true;
    if(btn) btn.style.display = 'none';
    setGestureHint('手势已开启：张手=散开 · 捏合=查看照片 · 握拳=圣诞树 · 手掌移动=转视角');
    predictWebcam();
  }catch(e){
    console.warn('[gesture]', e);
    if(btn){ btn.disabled = false; btn.textContent = '重试启用'; }
    const t = (e && (e.name === 'NotAllowedError' || e.name === 'PermissionDeniedError')) ? '摄像头未授权：点“重试启用”并在弹窗里选择允许'
      : (e && e.name === 'TimeoutError') ? '授权超时：点“重试启用”并在弹窗选择允许'
      : (e && e.name === 'NotFoundError') ? '没有检测到摄像头，按钮和键盘仍可用'
      : '手势启用失败，按钮和键盘仍可用';
    setGestureHint(t);
  }
}

function renderWebcamPreview(){
  const c = document.getElementById('webcam-canvas'); if(!c) return;
  const x = c.getContext('2d');
  const loop = () => {
    if(videoEl && videoEl.readyState >= 2){
      const sw = videoEl.videoWidth || c.width, sh = videoEl.videoHeight || c.height;
      const sc = Math.max(c.width/sw, c.height/sh), dw = sw*sc, dh = sh*sc;
      x.drawImage(videoEl, (c.width-dw)/2, (c.height-dh)/2, dw, dh);
    }
    requestAnimationFrame(loop);
  };
  loop();
}

function predictWebcam(){
  if(!handLandmarker || !videoEl) return;
  if(videoEl.readyState >= 2 && videoEl.currentTime !== lastVideoTime){
    lastVideoTime = videoEl.currentTime;
    try{
      processGestures(handLandmarker.detectForVideo(videoEl, performance.now()), performance.now());
    }catch(e){}
  }
  requestAnimationFrame(predictWebcam);
}

function fingerExtended(lm, tip, pip){
  const dTip = Math.hypot(lm[tip].x - lm[pip].x, lm[tip].y - lm[pip].y);
  const dPip = Math.hypot(lm[pip].x - lm[0].x, lm[pip].y - lm[0].y);
  return dTip > dPip * 1.15;
}

function processGestures(res, now){
  const hands = res && res.landmarks;
  if(!hands || !hands.length){ STATE.hand.detected = false; setCamDot(false); return; }
  const lm = hands[0];
  STATE.hand.detected = true; setCamDot(true);
  STATE.hand.x = (lm[9].x - 0.5) * 2;
  STATE.hand.y = (lm[9].y - 0.5) * 2;

  const palm = Math.hypot(lm[9].x - lm[0].x, lm[9].y - lm[0].y) || 0.001;
  const pinch = Math.hypot(lm[4].x - lm[8].x, lm[4].y - lm[8].y) / palm;

  const ext = [fingerExtended(lm,4,2), fingerExtended(lm,8,6), fingerExtended(lm,12,10), fingerExtended(lm,16,14), fingerExtended(lm,20,18)];
  const count = ext.filter(Boolean).length;

  /* 手势映射：张手=散开 · 捏合=查看照片 · 握拳=圣诞树 */
  let label = 'NONE';
  if(pinch < 0.34 && count <= 2) label = 'PINCH';
  else if(count >= 4) label = 'OPEN';
  else if(count <= 1) label = 'FIST';

  if(label !== gLastLabel){ gLastLabel = label; gHold = 0; return; }
  gHold++;
  if(gHold < 2) return;
  if(now - lastModeAt < 380) return;

  if(label === 'PINCH'){
    if(STATE.mode !== 'FOCUS'){
      lastModeAt = now; lastGrabAt = now;
      window.triggerPhotoGrab();
      if(STATE.mode !== 'FOCUS'){
        const photos = particleSystem.filter(p => p.type === 'PHOTO');
        if(photos.length){
          STATE.focusType = Math.floor(Math.random() * 4);
          STATE.focusTarget = photos[Math.floor(Math.random() * photos.length)].mesh;
          setMode('FOCUS');
        }
      }
      setGestureHint('捏合：查看照片');
    }
  } else if(label === 'OPEN'){
    if(STATE.mode !== 'SCATTER'){
      lastModeAt = now;
      window.setMode('SCATTER');
      setGestureHint('张手：散开');
    }
  } else if(label === 'FIST'){
    if(STATE.mode !== 'TREE'){
      lastModeAt = now;
      window.setMode('TREE');
      setGestureHint('握拳：圣诞树');
    }
  } else if(STATE.mode === 'FOCUS'){
    lastModeAt = now;
    window.setMode('TREE');
    setGestureHint('松手：回到圣诞树');
  }
}

const camBtn = document.getElementById('cam-enable');
if(camBtn) camBtn.addEventListener('click', startGesture);
setTimeout(() => { if(!camRunning) setGestureHint('点右下角「启用手势」开始：张手=散开 · 捏合=查看照片 · 握拳=圣诞树'); }, 1500);

        
init().catch(e=>{console.error("init failed",e); const l=document.getElementById("loader"); if(l){l.style.opacity=0; setTimeout(()=>l.remove(),200);} });     </script><script>
/* ============ 内置背景音乐：Jingle Bells（Web Audio 合成，无需外部音频） ============ */
(function(){
  var LRC = [
    [14.65,"Dashing through the snow"],
    [17.45,"In a one-horse open sleigh"],
    [19.94,"Over the fields we go"],
    [22.33,"Laughing all the way"],
    [25.01,"Bells on bobtails ring, yeah"],
    [27.30,"Making spirits bright"],
    [29.74,"What fun it is to ride and sing"],
    [32.18,"A sleighing song tonight"],
    [34.47,"Oh jingle bells, jingle bells"],
    [37.36,"Jingle all the way"],
    [39.56,"Oh, what fun it is to ride"],
    [42.09,"In a one-horse open sleigh"],
    [44.28,"Oh jingle bells, jingle bells"],
    [47.42,"Jingle all the way"],
    [49.21,"Oh, what fun it is to ride"],
    [51.90,"In a one-horse open sleigh"],
    [54.76,"Dashing through the snow"],
    [56.73,"In a one-horse open sleigh"],
    [59.56,"Over the fields we go"],
    [62.10,"Laughing all the way"],
    [64.49,"Bells on bobtails ring, yeah"],
    [66.78,"Making spirits bright"],
    [69.37,"What fun it is to ride and sing"],
    [71.76,"A sleighing song tonight"],
    [73.98,"Oh jingle bells, jingle bells"],
    [76.96,"Jingle all the way"],
    [79.10,"Oh, what fun it is to ride"],
    [81.65,"In a one-horse open sleigh"],
    [84.29,"Oh jingle bells, jingle bells"],
    [86.68,"Jingle all the way"],
    [88.96,"Oh, what fun it is to ride"],
    [91.50,"In a one-horse open sleigh"],
    [94.41,"Jingle bells, jingle bells"],
    [97.05,"Jingle all the way"],
    [99.19,"Oh, what fun it is to ride"],
    [101.53,"In a one-horse open sleigh"],
    [104.32,"Oh jingle bells, jingle bells"],
    [106.65,"Jingle all the way"],
    [109.09,"Oh, what fun it is to ride"],
    [111.28,"In a one-horse open sleigh"],
    [114.17,"Oh, what fun it is to ride"],
    [116.31,"In a one-horse open sleigh"]
  ];

  var NOTE = {C:0,D:2,E:4,F:5,G:7,A:9,B:11};
  function freq(n){
    var m = /^([A-G])(\d)$/.exec(n); if(!m) return 0;
    var midi = 60 + NOTE[m[1]] + (parseInt(m[2],10)-4)*12;
    return 440 * Math.pow(2, (midi-69)/12);
  }

  var BEAT = 0.42, LOOP_BEATS = 64, LOOPDUR = BEAT*LOOP_BEATS;

  /* 主旋律：每段 [起始拍, 音名, 持续拍] */
  var MEL = [
    [0,'E4',1],[1,'E4',1],[2,'E4',2],
    [4,'E4',1],[5,'E4',1],[6,'E4',2],
    [8,'E4',1],[9,'G4',1],[10,'C5',1],[11,'D5',1],[12,'E5',3],
    [16,'F5',1],[17,'F5',1],[18,'F5',1],[19,'F5',1],
    [20,'F5',1],[21,'E5',1],[22,'E5',1],[23,'E5',1],
    [24,'E5',1],[25,'D5',1],[26,'D5',1],[27,'E5',1],[28,'D5',2],[30,'G5',2],
    [32,'E4',1],[33,'E4',1],[34,'E4',2],
    [36,'E4',1],[37,'E4',1],[38,'E4',2],
    [40,'E4',1],[41,'G4',1],[42,'C5',1],[43,'D5',1],[44,'E5',3],
    [48,'F5',1],[49,'F5',1],[50,'F5',1],[51,'F5',1],
    [52,'F5',1],[53,'E5',1],[54,'E5',1],[55,'E5',1],
    [56,'G5',1],[57,'G5',1],[58,'F5',1],[59,'D5',1],[60,'C5',4]
  ];

  var S = {ac:null, master:null, playing:false, t0:0, next:0, vol:0.5,
           pumpId:null, tickId:null, loops:[], bellBuf:null, userUploaded:false, el:null, idx:-1};

  function AC(){
    if(!S.ac){
      var C = window.AudioContext || window.webkitAudioContext;
      S.ac = new C();
      S.master = S.ac.createGain();
      S.master.gain.value = 0.0001;
      S.master.connect(S.ac.destination);
    }
    return S.ac;
  }
  function masterTo(v){
    var C = AC();
    S.master.gain.cancelScheduledValues(C.currentTime);
    S.master.gain.setTargetAtTime(Math.max(0.0001, v), C.currentTime, 0.05);
  }
  function tone(f, at, dur, amp, type, dest){
    var C = S.ac, o = C.createOscillator(), g = C.createGain();
    o.type = type || 'triangle';
    o.frequency.setValueAtTime(f, at);
    g.gain.setValueAtTime(0.0001, at);
    g.gain.exponentialRampToValueAtTime(amp, at+0.03);
    g.gain.exponentialRampToValueAtTime(0.0001, at+dur);
    o.connect(g); g.connect(dest);
    o.start(at); o.stop(at+dur+0.03);
  }
  function bell(at, amp, dest){
    var C = S.ac;
    if(!S.bellBuf){
      var n = Math.floor(C.sampleRate*0.16), b = C.createBuffer(1, n, C.sampleRate), d = b.getChannelData(0);
      for(var i=0;i<n;i++){ d[i] = (Math.random()*2-1) * Math.pow(1-i/n, 4); }
      S.bellBuf = b;
    }
    var src = C.createBufferSource(), f = C.createBiquadFilter(), g = C.createGain();
    src.buffer = S.bellBuf;
    f.type = 'bandpass'; f.frequency.value = 5200; f.Q.value = 1.3;
    g.gain.setValueAtTime(amp, at);
    g.gain.exponentialRampToValueAtTime(0.001, at+0.13);
    src.connect(f); f.connect(g); g.connect(dest);
    src.start(at); src.stop(at+0.16);
  }

  function scheduleLoop(at){
    var C = S.ac, lg = C.createGain();
    lg.gain.value = 1; lg.connect(S.master);
    S.loops.push(lg);
    var life = (at - C.currentTime + LOOPDUR + 0.6) * 1000;
    setTimeout(function(){
      var i = S.loops.indexOf(lg);
      if(i >= 0) S.loops.splice(i,1);
      try{ lg.disconnect(); }catch(e){}
    }, Math.max(600, life));

    for(var i=0;i<MEL.length;i++){ tone(freq(MEL[i][1]), at+MEL[i][0]*BEAT, MEL[i][2]*BEAT*0.95, 0.32, 'triangle', lg); }
    for(var b=0;b<LOOP_BEATS;b+=2){
      var nm = (b%8===0) ? 'C3' : ((b%8===4) ? 'G3' : 'E3');
      tone(freq(nm), at+b*BEAT, BEAT*1.9, 0.14, 'sine', lg);
    }
    for(var k=0;k<LOOP_BEATS*2;k++){ bell(at+k*BEAT*0.5, 0.08+Math.random()*0.05, lg); }
  }
  function pump(){
    if(!S.playing) return;
    var C = S.ac;
    while(S.next < C.currentTime + 5){ scheduleLoop(S.next); S.next += LOOPDUR; }
  }

  function ensureEl(){
    if(S.el) return S.el;
    var st = document.createElement('style');
    st.textContent = '#jb-lyrics{position:absolute;left:50%;bottom:46px;transform:translateX(-50%);max-width:78vw;text-align:center;padding:6px 18px;color:#f7e3a8;font-size:15px;letter-spacing:1.5px;font-family:"Microsoft YaHei",serif;text-shadow:0 0 14px rgba(0,0,0,.95),0 0 26px rgba(212,175,55,.35);pointer-events:none;opacity:0;transition:opacity .25s ease;z-index:6;}';
    document.head.appendChild(st);
    S.el = document.createElement('div');
    S.el.id = 'jb-lyrics';
    document.body.appendChild(S.el);
    return S.el;
  }
  function hideLyrics(){ if(S.el){ S.el.style.opacity = 0; } S.idx = -1; }
  function tick(){
    if(!S.playing || !S.ac) return;
    var el = ensureEl();
    var t = S.ac.currentTime - S.t0, idx = -1;
    for(var i=0;i<LRC.length;i++){ if(LRC[i][0] <= t) idx = i; }
    if(idx < 0 || t > LRC[LRC.length-1][0]+4){ el.style.opacity = 0; S.idx = -1; return; }
    if(idx !== S.idx){ S.idx = idx; el.textContent = LRC[idx][1]; }
    el.style.opacity = 0.95;
  }
  function setPlayUI(p){
    var pb = document.getElementById('play-btn');
    if(pb) pb.innerText = p ? "⏸" : "⏯";
  }

  function start(){
    var C = AC();
    if(C.state === 'suspended'){ C.resume(); }
    S.playing = true;
    S.t0 = C.currentTime + 0.08;
    S.next = S.t0;
    masterTo(S.vol * 0.62);
    pump();
    if(S.pumpId) clearInterval(S.pumpId);
    S.pumpId = setInterval(pump, 1200);
    if(S.tickId) clearInterval(S.tickId);
    S.tickId = setInterval(tick, 180);
    S.idx = -1; tick();
    setPlayUI(true);
  }
  function stop(){
    S.playing = false;
    if(S.ac) masterTo(0.0001);
    for(var i=0;i<S.loops.length;i++){ try{ S.loops[i].disconnect(); }catch(e){} }
    S.loops = [];
    if(S.pumpId){ clearInterval(S.pumpId); S.pumpId = null; }
    if(S.tickId){ clearInterval(S.tickId); S.tickId = null; }
    hideLyrics();
    setPlayUI(false);
  }

  window.__jb = {
    toggle: function(){ S.playing ? stop() : start(); },
    restart: function(){ stop(); setTimeout(start, 120); },
    setVolume: function(v){ S.vol = v; if(S.playing) masterTo(v * 0.62); },
    stop: function(){ if(S.playing) stop(); },
    isPlaying: function(){ return S.playing; }
  };

  /* 用户自己上传 mp3 时让位给真实音频 */
  function bindUploadWatch(){
    var mi = document.getElementById('music-input');
    if(!mi){ setTimeout(bindUploadWatch, 300); return; }
    mi.addEventListener('change', function(){ S.userUploaded = true; stop(); });
  }
  bindUploadWatch();

  /* 首次交互（点/拖/按键）自动开始播，符合浏览器自动播放策略 */
  function autoStart(ev){
    if(S.playing || S.userUploaded) return;
    var t = ev && ev.target;
    if(t && t.closest && t.closest('#play-btn')) return;
    if(t && t.closest && t.closest('input[type=range]')) return;
    start();
  }
  document.addEventListener('pointerdown', autoStart, true);
  document.addEventListener('keydown', autoStart, true);
})();
</script>
